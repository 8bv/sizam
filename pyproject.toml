[build-system]
requires = ["setuptools >= 61.0"]

[project]
name = "sizam"
version = "0.0.3"
authors = [
  { name="Golvokevich Boris", email="golovkevich@outlook.com" },
]
description = "Wraper for intercat with wiki2035"
requires-python = ">=3.10"
dependencies = [
  "openpyxl~=3.1",
  "httpx~=0.25",
  "fastapi==0.104.1",
  "python-multipart",
  "uvicorn",
  "SQLAlchemy~=2.0",
  "alembic~=1.13",
  "jinja2~=3.1"
]

[tool.setuptools.package-data]
"sizam.views.templates" = ["*.html"]
